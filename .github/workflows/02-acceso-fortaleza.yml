name: Acceso a la Fortaleza Prohibida

on: push

jobs:
    acceso-a-la-base:
        runs-on: ubuntu-latest

        steps:
            - name: El agente llega a la fortaleza
              run: |
                  echo "Agente ${{github.actor}} llega a la fortaleza"
                  echo ""
                  echo "Buscar los archivos de la Legión"
                  ls -la
                  echo ""
                  echo "❌ pero qué paso? no hay nada"

            - name: Reporte de identidad
              run: |
                  echo "Reporte de identidad"
                  echo "===================="
                  echo ""
                  echo "Nombre clave: ${{github.actor}}"
                  echo ""
                  echo "Contexto de Github"
                  echo "Repo: ${{github.repository}}"
                  echo "Operación: ${{github.sha}}"
                  echo "Metadata: ${{toJson(github)}}"

            - name: Capacidades del agente
              run: |
                  echo "Capacidades detectadas"
                  echo "Sistema operativo"
                  uname -a
                  echo "Habilidades técnicas"
                  node --version
                  git --version
                  python3 --version

            - name: Reconocimiento del terreno
              run: |
                  echo "Reconocimiento del terreno"
                  ls /
