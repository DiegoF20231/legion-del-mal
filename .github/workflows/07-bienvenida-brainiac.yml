name: Bienvenida de Brainiac

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  responder-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Informar que Brainiac revisará el issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "¡Gracias por crear este issue! Brainiac ya está revisándolo. 🧠"
            });